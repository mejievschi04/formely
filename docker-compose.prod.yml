# Override producție VPS (domenii formely.org + TLS via Caddy)
# Folosire:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#   ./scripts/deploy-vps.sh
#
# Necesită Docker Compose v2.24+ (suportă !reset pe ports/volumes).
#
# Diferențe față de baza locală:
# - fără mount ./backend (doar volume storage/cache)
# - fără porturi publice pe postgres / SPA / API
# - Caddy pe 80/443 cu Let's Encrypt
# - nginx-backend citește public din containerul backend

services:
  postgres:
    ports: !reset []

  backend:
    volumes: !reset
      - backend_storage:/var/www/html/storage
      - backend_cache:/var/www/html/bootstrap/cache

  queue:
    volumes: !reset
      - backend_storage:/var/www/html/storage
      - backend_cache:/var/www/html/bootstrap/cache

  scheduler:
    volumes: !reset
      - backend_storage:/var/www/html/storage
      - backend_cache:/var/www/html/bootstrap/cache

  nginx-backend:
    ports: !reset []
    volumes: !reset
      - ./docker/nginx-backend.conf:/etc/nginx/conf.d/default.conf:ro
    volumes_from:
      - backend

  frontend:
    ports: !reset []

  website:
    ports: !reset []

  backoffice:
    ports: !reset []

  caddy:
    image: caddy:2-alpine
    container_name: formely-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      CADDY_EMAIL: ${CADDY_EMAIL:-ops@formely.org}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - website
      - frontend
      - backoffice
      - nginx-backend
    networks:
      - formely-network

volumes:
  caddy_data:
  caddy_config:
