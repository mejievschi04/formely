# Override producție VPS — Nginx pe host ocupă 80/443
# Folosire: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Publică serviciile DOAR pe 127.0.0.1 (Nginx host proxiază domeniile).

services:
  backend:
    volumes: !override
      - backend_storage:/var/www/html/storage
      - backend_cache:/var/www/html/bootstrap/cache

  queue:
    volumes: !override
      - backend_storage:/var/www/html/storage
      - backend_cache:/var/www/html/bootstrap/cache

  scheduler:
    volumes: !override
      - backend_storage:/var/www/html/storage
      - backend_cache:/var/www/html/bootstrap/cache

  nginx-backend:
    ports:
      - "127.0.0.1:${BACKEND_PORT:-18080}:80"
    volumes: !override
      - ./docker/nginx-backend.conf:/etc/nginx/conf.d/default.conf:ro
    volumes_from:
      - backend

  frontend:
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-13001}:80"

  website:
    ports:
      - "127.0.0.1:${WEBSITE_PORT:-14322}:80"

  backoffice:
    ports:
      - "127.0.0.1:${BACKOFFICE_PORT:-15181}:80"
