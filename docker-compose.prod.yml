# Override producție VPS — Nginx pe host ocupă deja 80/443
# Folosire:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#   ./scripts/deploy-vps.sh
#
# Necesită Docker Compose v2.24+ (!reset pe ports/volumes).
#
# Containerele ascultă DOAR pe 127.0.0.1 (nu public).
# TLS + domenii: vhost-uri în docker/nginx-host/ → /etc/nginx/sites-available/

services:
  postgres:
    ports: !reset []

  backend:
    volumes: !reset
      - backend_storage:/var/www/html/storage
      - backend_cache:/var/www/html/bootstrap/cache

  queue:
    volumes: !reset
      - backend_storage:/var/www/html/storage
      - backend_cache:/var/www/html/bootstrap/cache

  scheduler:
    volumes: !reset
      - backend_storage:/var/www/html/storage
      - backend_cache:/var/www/html/bootstrap/cache

  nginx-backend:
    ports: !reset
      - "127.0.0.1:${BACKEND_PORT:-18080}:80"
    volumes: !reset
      - ./docker/nginx-backend.conf:/etc/nginx/conf.d/default.conf:ro
    volumes_from:
      - backend

  frontend:
    ports: !reset
      - "127.0.0.1:${FRONTEND_PORT:-13001}:80"

  website:
    ports: !reset
      - "127.0.0.1:${WEBSITE_PORT:-14322}:80"

  backoffice:
    ports: !reset
      - "127.0.0.1:${BACKOFFICE_PORT:-15181}:80"
