# Additional services; same source/builds as the academies, separate runtime data.
# docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.demo.yml up -d
services:
  demo-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DEMO_DB_DATABASE:-formely_demo}
      POSTGRES_USER: ${DEMO_DB_USERNAME:-formely_demo_user}
      POSTGRES_PASSWORD: ${DEMO_DB_PASSWORD:?Set DEMO_DB_PASSWORD}
    volumes:
      - demo_postgres_data:/var/lib/postgresql/data
    networks:
      - demo-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  demo-backend:
    extends:
      file: docker-compose.yml
      service: backend
    container_name: formely-demo-backend
    environment: &demo_env
      APP_NAME: Formely Demo
      APP_KEY: ${DEMO_APP_KEY:?Set a separate DEMO_APP_KEY}
      APP_URL: ${DEMO_URL:-https://demo.formely.org}
      DB_HOST: demo-postgres
      DB_DATABASE: ${DEMO_DB_DATABASE:-formely_demo}
      DB_USERNAME: ${DEMO_DB_USERNAME:-formely_demo_user}
      DB_PASSWORD: ${DEMO_DB_PASSWORD:?Set DEMO_DB_PASSWORD}
      SESSION_DOMAIN: ""
      SESSION_COOKIE: formely_demo_session
      SESSION_SECURE_COOKIE: "true"
      FRONTEND_URL: ${DEMO_URL:-https://demo.formely.org}
      FORMELY_LMS_URL: ${DEMO_URL:-https://demo.formely.org}
      SANCTUM_STATEFUL_DOMAINS: demo.formely.org
      FORMELY_DEMO_INSTANCE: "true"
      FORMELY_DEMO_LOGIN_ENABLED: "true"
      FORMELY_PUBLIC_REGISTER_ENABLED: "false"
      FORMELY_PLATFORM_OPERATOR_EMAIL: ""
      FORMELY_PLATFORM_OPERATOR_PASSWORD: ""
      FORMELY_LEADS_NOTIFY_EMAIL: ""
      AI_ENABLED: "false"
      OPENAI_API_KEY: ""
      MAIL_MAILER: log
      MAIL_HOST: ""
      MAIL_USERNAME: ""
      MAIL_PASSWORD: ""
      PHP_FPM_MAX_CHILDREN: 6
    volumes: !override
      - demo_storage:/var/www/html/storage
      - demo_cache:/var/www/html/bootstrap/cache
    depends_on: !override
      demo-postgres:
        condition: service_healthy
    networks: !override
      demo-network:
        aliases:
          - backend

  demo-queue:
    extends:
      file: docker-compose.yml
      service: queue
    container_name: formely-demo-queue
    environment: *demo_env
    volumes: !override
      - demo_storage:/var/www/html/storage
      - demo_cache:/var/www/html/bootstrap/cache
    depends_on: !override
      demo-backend:
        condition: service_healthy
    networks: !override
      - demo-network

  demo-scheduler:
    extends:
      file: docker-compose.yml
      service: scheduler
    container_name: formely-demo-scheduler
    environment: *demo_env
    volumes: !override
      - demo_storage:/var/www/html/storage
      - demo_cache:/var/www/html/bootstrap/cache
    depends_on: !override
      demo-backend:
        condition: service_healthy
    networks: !override
      - demo-network

  demo-api:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./docker/nginx-backend.conf:/etc/nginx/conf.d/default.conf:ro
      - demo_storage:/var/www/html/storage:ro
    depends_on:
      demo-backend:
        condition: service_healthy
    networks:
      demo-network:
        aliases:
          - nginx-backend

  demo-frontend:
    extends:
      file: docker-compose.yml
      service: frontend
    container_name: formely-demo-frontend
    build:
      args:
        # Force same-origin API/storage: never bake the academy API into demo.
        VITE_API_URL: /api
        VITE_STORAGE_URL: ""
    ports:
      - "127.0.0.1:${DEMO_PORT:-13002}:80"
    depends_on: !override
      demo-api:
        condition: service_started
    networks: !override
      - demo-network

volumes:
  demo_postgres_data:
  demo_storage:
  demo_cache:

networks:
  demo-network:
    driver: bridge
