name: Secret scanning

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  gitleaks:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # gitleaks scanează intervalul de commit-uri din push; cu istoric de 1 commit nu găsește începutul
          # intervalului și iese cu eroare („scanned ~0 bytes”).
          fetch-depth: 0

      - name: Run gitleaks
        # acțiunea nu acceptă `args` (rulează deja cu --redact și eșuează doar dacă găsește secrete)
        uses: zricethezav/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
