# Formely — vhost-uri pentru Nginx pe host (80/443 deja pe VPS)
# Instalare:
#   sudo cp docker/nginx-host/formely.conf /etc/nginx/sites-available/formely.conf
#   sudo ln -sf /etc/nginx/sites-available/formely.conf /etc/nginx/sites-enabled/formely.conf
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d formely.org -d www.formely.org -d api.formely.org -d academy.formely.org -d admin.formely.org
#
# Upstream-uri = porturile din .env (default-uri prod).
# Containerele Docker ascultă doar pe 127.0.0.1.

upstream formely_website {
    server 127.0.0.1:14322;
    keepalive 8;
}

upstream formely_api {
    server 127.0.0.1:18080;
    keepalive 16;
}

upstream formely_academy {
    server 127.0.0.1:13001;
    keepalive 16;
}

upstream formely_admin {
    server 127.0.0.1:15181;
    keepalive 8;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# --- Website ---
server {
    listen 80;
    listen [::]:80;
    server_name formely.org www.formely.org;

    client_max_body_size 20m;

    location / {
        proxy_pass http://formely_website;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}

# --- API ---
server {
    listen 80;
    listen [::]:80;
    server_name api.formely.org;

    client_max_body_size 550m;
    client_body_timeout 600s;
    proxy_read_timeout 300s;
    proxy_send_timeout 600s;

    location / {
        proxy_pass http://formely_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
    }
}

# --- Academy (LMS) — /api e proxiat deja în containerul frontend ---
server {
    listen 80;
    listen [::]:80;
    server_name academy.formely.org;

    client_max_body_size 550m;
    client_body_timeout 600s;
    proxy_read_timeout 300s;
    proxy_send_timeout 600s;

    location / {
        proxy_pass http://formely_academy;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

# --- Backoffice ---
server {
    listen 80;
    listen [::]:80;
    server_name admin.formely.org;

    client_max_body_size 550m;
    client_body_timeout 600s;
    proxy_read_timeout 300s;
    proxy_send_timeout 600s;

    location / {
        proxy_pass http://formely_admin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
