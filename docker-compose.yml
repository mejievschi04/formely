# Formely — Docker Compose (bază)
# Producție VPS: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# Vezi docs/DEPLOY.md

services:
  postgres:
    image: postgres:16-alpine
    container_name: formely-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-formely}
      POSTGRES_USER: ${DB_USERNAME:-formely_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-formely_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    networks:
      - formely-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
      network: host
    container_name: backend
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
      - backend_storage:/var/www/html/storage
      - backend_cache:/var/www/html/bootstrap/cache
    environment: &backend_env
      APP_NAME: ${APP_NAME:-Formely}
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY:-}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-http://localhost:8000}
      APP_TIMEZONE: ${APP_TIMEZONE:-Europe/Bucharest}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-formely}
      DB_USERNAME: ${DB_USERNAME:-formely_user}
      DB_PASSWORD: ${DB_PASSWORD:-formely_password}
      DB_SSLMODE: ${DB_SSLMODE:-prefer}
      SESSION_DRIVER: file
      CACHE_STORE: file
      SESSION_LIFETIME: ${SESSION_LIFETIME:-120}
      SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-false}
      SESSION_SAME_SITE: ${SESSION_SAME_SITE:-lax}
      SESSION_DOMAIN: ${SESSION_DOMAIN:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      FORMELY_BACKOFFICE_URL: ${FORMELY_BACKOFFICE_URL:-http://localhost:5180}
      FORMELY_LMS_URL: ${FORMELY_LMS_URL:-}
      FORMELY_LEADS_NOTIFY_EMAIL: ${FORMELY_LEADS_NOTIFY_EMAIL:-}
      FORMELY_PUBLIC_REGISTER_ENABLED: ${FORMELY_PUBLIC_REGISTER_ENABLED:-false}
      FORMELY_TRIAL_DAYS: ${FORMELY_TRIAL_DAYS:-15}
      FORMELY_PLATFORM_OPERATOR_EMAIL: ${FORMELY_PLATFORM_OPERATOR_EMAIL:-}
      FORMELY_PLATFORM_OPERATOR_NAME: ${FORMELY_PLATFORM_OPERATOR_NAME:-}
      FORMELY_PLATFORM_OPERATOR_PASSWORD: ${FORMELY_PLATFORM_OPERATOR_PASSWORD:-}
      SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS:-}
      AI_PROVIDER: ${AI_PROVIDER:-groq}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_API_URL: ${GROQ_API_URL:-https://api.groq.com/openai/v1}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.1-8b-instant}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_API_URL: ${OPENAI_API_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      HUGGINGFACE_API_KEY: ${HUGGINGFACE_API_KEY:-}
      HUGGINGFACE_API_URL: ${HUGGINGFACE_API_URL:-https://router.huggingface.co}
      HUGGINGFACE_MODEL: ${HUGGINGFACE_MODEL:-meta-llama/Meta-Llama-3.1-8B-Instruct}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      OLLAMA_API_URL: ${OLLAMA_API_URL:-http://host.docker.internal:11434/v1}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma:2b-instruct}
      OLLAMA_CREATOR_MODEL: ${OLLAMA_CREATOR_MODEL:-gemma:2b-instruct}
      OLLAMA_CREATOR_QUALITY_MODEL: ${OLLAMA_CREATOR_QUALITY_MODEL:-qwen2.5:7b-instruct}
      OLLAMA_TUTOR_MODEL: ${OLLAMA_TUTOR_MODEL:-gemma:2b-instruct}
      AI_VERIFY_SSL: ${AI_VERIFY_SSL:-true}
      LOG_CHANNEL: stack
      LOG_LEVEL: ${LOG_LEVEL:-error}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-database}
      MAIL_MAILER: ${MAIL_MAILER:-log}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_ENCRYPTION: ${MAIL_ENCRYPTION:-tls}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-noreply@localhost}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Formely}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - formely-network

  queue:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
      network: host
    container_name: formely-queue
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    volumes:
      - ./backend:/var/www/html
      - backend_storage:/var/www/html/storage
      - backend_cache:/var/www/html/bootstrap/cache
    environment:
      <<: *backend_env
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started
    networks:
      - formely-network

  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
      network: host
    container_name: formely-scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    command: sh -c "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"
    volumes:
      - ./backend:/var/www/html
      - backend_storage:/var/www/html/storage
      - backend_cache:/var/www/html/bootstrap/cache
    environment:
      <<: *backend_env
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started
    networks:
      - formely-network

  nginx-backend:
    image: nginx:alpine
    container_name: formely-nginx-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:80"
    volumes:
      - ./backend/public:/var/www/html/public:ro
      - ./docker/nginx-backend.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - formely-network

  # LMS — academy.formely.org (în prod: Nginx host → 127.0.0.1:FRONTEND_PORT)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
      network: host
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
        VITE_BACKOFFICE_URL: ${VITE_BACKOFFICE_URL:-https://admin.formely.org}
        VITE_STORAGE_URL: ${VITE_STORAGE_URL:-}
        VITE_APP_ENV: ${VITE_APP_ENV:-production}
    container_name: frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3001}:80"
    depends_on:
      - nginx-backend
    networks:
      - formely-network

  # Marketing site — formely.org
  website:
    build:
      context: ./website
      dockerfile: Dockerfile
      target: production
      network: host
      args:
        VITE_SITE_URL: ${VITE_SITE_URL:-https://formely.org}
        VITE_APP_URL: ${VITE_APP_URL:-https://academy.formely.org}
        VITE_API_URL: ${VITE_WEBSITE_API_URL:-https://api.formely.org}
        VITE_LEGAL_NAME: ${VITE_LEGAL_NAME:-}
        VITE_LEGAL_ADDRESS: ${VITE_LEGAL_ADDRESS:-}
    container_name: formely-website
    restart: unless-stopped
    ports:
      - "${WEBSITE_PORT:-4322}:80"
    networks:
      - formely-network

  # Platform ops — admin.formely.org
  backoffice:
    build:
      context: ./backoffice
      dockerfile: Dockerfile
      target: production
      network: host
    container_name: formely-backoffice
    restart: unless-stopped
    ports:
      - "${BACKOFFICE_PORT:-5181}:80"
    depends_on:
      - nginx-backend
    networks:
      - formely-network

volumes:
  postgres_data:
    driver: local
  backend_storage:
    driver: local
  backend_cache:
    driver: local

networks:
  formely-network:
    driver: bridge
