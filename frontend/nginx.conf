server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Keep above API upload limits so reverse-proxied deployments do not fail early.
    client_max_body_size 550m;
    client_body_timeout 600s;

    # Outer proxy (host nginx / Cloudflare) sends https; do not overwrite with $scheme (always http here).
    set $forwarded_proto $scheme;
    if ($http_x_forwarded_proto ~* "https") {
        set $forwarded_proto "https";
    }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript application/json;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Same-origin API + storage.
    # ^~ beats the regex static-asset location below (otherwise .jpeg/.png under
    # /storage/ are served from the SPA root and 404).
    location ^~ /api/ {
        proxy_pass http://nginx-backend:80/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 300s;
        proxy_send_timeout 600s;
        client_max_body_size 550m;
    }

    location ^~ /storage/ {
        proxy_pass http://nginx-backend:80/storage/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        expires 7d;
        add_header Cache-Control "public";
    }

    location ^~ /sanctum/ {
        proxy_pass http://nginx-backend:80/sanctum/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.mjs$ {
        types { application/javascript mjs; }
        default_type application/javascript;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.wasm$ {
        types { application/wasm wasm; }
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }
}
